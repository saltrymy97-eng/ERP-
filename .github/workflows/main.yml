name: 🏗️ Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 بناء نسخة Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 تنزيل الكود
        uses: actions/checkout@v4

      - name: 🟢 تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت الاعتماديات
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: 🔧 إعادة بناء better-sqlite3
        run: npx electron-rebuild -f -w better-sqlite3
        continue-on-error: true

      - name: 🔨 بناء React
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: 🏗️ بناء ملف EXE
        run: npx electron-builder --win --publish never

      - name: 📊 عرض الملفات
        run: |
          Write-Host "محتويات dist:"
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse | Select-Object Name, @{Name='Size(MB)';Expression={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          } else {
            Write-Host "⚠️ مجلد dist غير موجود!"
          }

      - name: 📤 رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Windows-EXE
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30
          if-no-files-found: error
